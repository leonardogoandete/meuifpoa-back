quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.cors=false
quarkus.http.cors.origins=/.*/
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true
# Define o caminho do Swagger UI
quarkus.swagger-ui.path=/meuifpoa/q/swagger-ui
# Define o caminho completo para a documentação OpenAPI
quarkus.smallrye-openapi.path=/meuifpoa/q/openapi
quarkus.swagger-ui.url=https://app.poa.ifrs.edu.br/meuifpoa/q/openapi
quarkus.smallrye-openapi.servers=https://app.poa.ifrs.edu.br
mp.jwt.verify.issuer=https://securetoken.google.com/ifrspoa-d9f18
mp.jwt.verify.publickey.location=google-key.pem
quarkus.smallrye-jwt.public-key.location=https://www.googleapis.com/robot/v1/metadata/x509/securetoken@system.gserviceaccount.com
quarkus.smallrye-jwt.enabled=true