name: Build Imagem
on:
  push:
    branches:
      - okhttp3

jobs:
  gerando-imagem-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-repo
        uses: actions/checkout@v3

      - name: Build da imagem Docker
        run: docker build -t leogoandete/app-ifrsback-jsoup .

      - name: Autenticando no docker registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Enviando a imagem para o Dockerhub
        run: docker push leogoandete/app-ifrsback-jsoup

  aplicando-deployment:
    name: Aplicando deployment
    runs-on: ubuntu-latest
    needs: gerando-imagem-docker

    steps:
      - name: Kubectl tool installer
        uses: Azure/setup-kubectl@v1

      - name: Setup kubectl
        env:
          K8S_CONFIG: ${{ secrets.K8S_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "${K8S_CONFIG}" | base64 --decode > $HOME/.kube/config

      - name: Setup deployment
        env:
          K8S_DEPLOYMENT: ${{ secrets.K8S_DEPLOYMENT }}
        run: |
          echo "${K8S_DEPLOYMENT}" | base64 --decode > $HOME/deployment.yaml

      - name: Aplicando deployment
        run: kubectl apply -f $HOME/deployment.yaml

      - name: Rollout deployment
        run: kubectl rollout restart deployment meuifrspoa-deployment

      - name: Wait For Deployment To Start
        run: sleep 20s

      - name: Wait For Deployment To Finish
        run: kubectl get pods | grep meuifrspoa

